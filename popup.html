<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapShot Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <img src="icons/icon48.png" alt="SnapShot Pro" width="28" height="28">
        <h1>SnapShot Pro</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <div class="main-content">
      <section class="section">
        <h2 class="section-title">Capture Mode</h2>
        <div class="capture-modes">
          <button class="mode-btn" data-mode="fullpage" title="Full Page">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            <span>Full Page</span>
          </button>
          <button class="mode-btn active" data-mode="visible" title="Visible Area">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 1l22 22M1 23L23 1M23 23L1 1"></path>
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
            <span>Visible Area</span>
          </button>
          <button class="mode-btn" data-mode="region" title="Region Selection">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 3a2 2 0 0 0-2 2"></path>
              <path d="M19 3a2 2 0 0 1 2 2"></path>
              <path d="M21 19a2 2 0 0 1-2 2"></path>
              <path d="M3 19a2 2 0 0 0 2 2"></path>
              <path d="M3 3v18h18"></path>
            </svg>
            <span>Region</span>
          </button>
          <button class="mode-btn" data-mode="element" title="Element Screenshot">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Element</span>
          </button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">Delay Timer</h2>
        <div class="delay-options">
          <button class="delay-btn active" data-delay="0">None</button>
          <button class="delay-btn" data-delay="3">3s</button>
          <button class="delay-btn" data-delay="5">5s</button>
          <button class="delay-btn" data-delay="10">10s</button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">Output Format</h2>
        <div class="format-options">
          <div class="format-select">
            <select id="formatSelect">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </div>
          <div class="quality-slider" id="qualitySlider" style="display: none;">
            <label for="qualityRange">Quality: <span id="qualityValue">92</span>%</label>
            <input type="range" id="qualityRange" min="10" max="100" value="92">
          </div>
        </div>
      </section>

      <section class="section">
        <div class="toggles">
          <label class="toggle-label">
            <span>Auto-copy to clipboard</span>
            <input type="checkbox" id="autoCopy" class="toggle-input">
            <span class="toggle-switch"></span>
          </label>
          <label class="toggle-label">
            <span>Auto-download</span>
            <input type="checkbox" id="autoDownload" class="toggle-input">
            <span class="toggle-switch"></span>
          </label>
        </div>
      </section>

      <section class="section">
        <button id="captureBtn" class="capture-button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          Capture
        </button>
      </section>

      <section class="section history-section">
        <div class="section-header">
          <h2 class="section-title">History</h2>
          <button id="clearHistory" class="text-btn">Clear</button>
        </div>
        <div class="history-gallery" id="historyGallery">
          <div class="empty-history">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <p>No screenshots yet</p>
          </div>
        </div>
      </section>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <label>Save format</label>
          <select id="settingsFormat">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
          </select>
        </div>
        <div class="setting-item">
          <label>Default quality</label>
          <input type="range" id="settingsQuality" min="10" max="100" value="92">
          <span id="settingsQualityValue">92%</span>
        </div>
        <div class="setting-item">
          <label>Max history items</label>
          <select id="settingsMaxHistory">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
          </select>
        </div>
        <div class="setting-item">
          <label>Filename prefix</label>
          <input type="text" id="settingsPrefix" value="screenshot" maxlength="30">
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
